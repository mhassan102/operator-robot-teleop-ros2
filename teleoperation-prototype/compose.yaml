name: ${COMPOSE_PROJECT_NAME:-ros2_teleop_poc}

x-ros-service: &ros-service
  image: ${TELEOP_IMAGE:-ros2-teleop-poc:humble}
  build:
    context: .
    dockerfile: docker/Dockerfile
  init: true
  environment:
    ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-42}
    RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
    CYCLONEDDS_URI: file:///teleop/config/cyclonedds.xml
    DISPLAY: ${DISPLAY:-:0}
    QT_X11_NO_MITSHM: "1"
    LIBGL_ALWAYS_SOFTWARE: "1"
    TELEOP_GAZEBO_GUI: ${TELEOP_GAZEBO_GUI:-false}
  volumes:
    - ./config:/teleop/config:ro
    - ./ros2_ws:/teleop/ros2_ws
    - /tmp/.X11-unix:/tmp/.X11-unix:rw
  networks:
    - teleop_net
  restart: "no"

services:
  operator:
    <<: *ros-service
    container_name: ros2-teleop-operator
    hostname: operator
    command: ["sleep", "infinity"]
    cap_add:
      - NET_ADMIN
    healthcheck:
      test: ["CMD", "bash", "-c", "source /opt/ros/humble/setup.bash && ros2 pkg list >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  robot:
    <<: *ros-service
    container_name: ros2-teleop-robot
    hostname: robot
    command:
      [
        "ros2",
        "launch",
        "teleop_demo",
        "robot_sim.launch.py",
      ]
    healthcheck:
      test:
        [
          "CMD",
          "bash",
          "-c",
          "source /opt/ros/humble/setup.bash && source /teleop/ros2_ws/install/setup.bash && ros2 topic list | grep -q /joint_states",
        ]
      interval: 5s
      timeout: 8s
      retries: 36
      start_period: 45s

networks:
  teleop_net:
    name: ros2_teleop_poc_net
    driver: bridge
