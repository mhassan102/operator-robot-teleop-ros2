# Operator-only Compose for F8 (mlink Stage 5) on the operator PC.
# Robot runs on Orin. Host network so the backend talks to mlink-op on
# 127.0.0.1. HTTP is bound to 127.0.0.1 (not all NICs). Localhost Zenoh
# tests keep using compose.yaml.
name: ${COMPOSE_PROJECT_NAME:-ros2_teleop_mlink_op}

services:
  operator:
    image: ${TELEOP_IMAGE:-ros2-teleop-poc:humble}
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: ros2-teleop-operator-mlink
    init: true
    network_mode: host
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-42}
      RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
      CYCLONEDDS_URI: file:///teleop/config/cyclonedds-localhost.xml
      TELEOP_RUN_ZENOH_ROUTER: "0"
      TELEOP_MLINK: "1"
      TELEOP_MLINK_TX: ${TELEOP_MLINK_TX:-127.0.0.1:5501}
      TELEOP_MLINK_RX: ${TELEOP_MLINK_RX:-127.0.0.1:5502}
      TELEOP_HTTP_HOST: "127.0.0.1"
      TELEOP_WEB_ROOT: "/teleop/web"
    volumes:
      - ./config:/teleop/config:ro
      - ./ros2_ws:/teleop/ros2_ws
      - ./web:/teleop/web:ro
    command:
      [
        "ros2",
        "run",
        "teleop_demo",
        "operator_backend",
        "--ros-args",
        "--params-file",
        "/teleop/config/teleop.yaml",
      ]
    healthcheck:
      test:
        [
          "CMD",
          "bash",
          "-c",
          "python3 -c \"from urllib.request import urlopen; urlopen('http://127.0.0.1:8090/api/health', timeout=3)\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: "no"
