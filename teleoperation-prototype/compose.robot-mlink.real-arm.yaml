# Overlay for TELEOP_ARM=real only. start_robot_mlink.sh --real-arm adds this
# file. Device and TELEOP_SERIAL_PORT default to /dev/ttyACM0.
# Gazebo compose (compose.robot-mlink.yaml alone) must not mount a serial device.
services:
  robot:
    devices:
      - ${TELEOP_SERIAL_PORT:-/dev/ttyACM0}:${TELEOP_SERIAL_PORT:-/dev/ttyACM0}
    environment:
      TELEOP_SERIAL_PORT: ${TELEOP_SERIAL_PORT:-/dev/ttyACM0}
