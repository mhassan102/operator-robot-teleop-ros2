controller_manager:
  ros__parameters:
    update_rate: 100
    use_sim_time: true
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    arm_controller:
      type: forward_command_controller/ForwardCommandController
    gripper_controller:
      type: forward_command_controller/ForwardCommandController
    pid_gains:
      joint1: {p: 200.0, i: 0.01, d: 5.0}
      joint2: {p: 200.0, i: 0.01, d: 5.0}
      joint3: {p: 150.0, i: 0.01, d: 4.0}
      joint4: {p: 80.0, i: 0.01, d: 2.0}
      joint5: {p: 40.0, i: 0.0, d: 1.0}
      joint6: {p: 40.0, i: 0.0, d: 1.0}
      finger_left: {p: 50.0, i: 0.0, d: 1.0}
      finger_right: {p: 50.0, i: 0.0, d: 1.0}

arm_controller:
  ros__parameters:
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6
    interface_name: position

gripper_controller:
  ros__parameters:
    joints:
      - finger_left
      - finger_right
    interface_name: position
