# Two port-pairs on localhost. Used conceptually for Stage 2; Stage 1
# builds equivalent configs in tests without running CLIs.
session_id: 1
listen_app: "127.0.0.1:5501"
send_app:   "127.0.0.1:5502"
paths:
  - name: eth
    bind_ip: 127.0.0.1
    bind_port: 41001
    peer: 127.0.0.1:42001
  - name: wifi
    bind_ip: 127.0.0.1
    bind_port: 41002
    peer: 127.0.0.1:42002
