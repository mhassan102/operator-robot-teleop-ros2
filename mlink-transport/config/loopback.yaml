# Operator side of the Stage 2 localhost loopback.
# Complementary peer: config/loopback-edge.yaml
# eth = 41001↔42001, wifi = 41002↔42002. No ifname (no SO_BINDTODEVICE).
session_id: 1
listen_app: "127.0.0.1:5501"
send_app:   "127.0.0.1:5502"
paths:
  - name: eth
    bind_ip: 127.0.0.1
    bind_port: 41001
    peer: 127.0.0.1:42001
  - name: wifi
    bind_ip: 127.0.0.1
    bind_port: 41002
    peer: 127.0.0.1:42002

