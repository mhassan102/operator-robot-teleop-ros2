# SO-ARM laptop — one wifi NIC via ICE. App face matches lab-edge.yaml.
# WAN hop is the nominated socket (direct or coturn). No Tailscale.
# ICE file: turn/config/local_edge.yaml (gitignored). Video is not on this path.
# Start: ./scripts/start_daemon.sh edge --ice
session_id: 1
listen_app: "127.0.0.1:5503"
send_app: "127.0.0.1:5504"
max_payload: 1400
down_timeout_us: 1500000
paths:
  - name: ice
    transport: ice
    ice_config: ../../turn/config/local_edge.yaml
