# F6 lab shortcut (not the F8 product path). ICE pinned to Tailscale.
# Kept only as a record of the old Orin-hosted MediaMTX layout.
logLevel: info
logDestinations: [file]
logFile: logs/mediamtx.log
udpMaxPayloadSize: 1200

rtsp: true
rtmp: false
hls: false
srt: false
moq: false
api: false
metrics: false
pprof: false
playback: false

webrtc: true
webrtcAddress: :8889
rtspAddress: :8554
webrtcEncryption: false
webrtcAllowOrigins: ["*"]
webrtcLocalUDPAddress: :8189
webrtcLocalTCPAddress: ""
webrtcIPsFromInterfaces: true
webrtcIPsFromInterfacesList: [tailscale0]
webrtcAdditionalHosts: ["100.101.94.5"]
webrtcICEServers2: []

paths:
  cam:
    source: udp+rtp://127.0.0.1:5004
    rtpSDP: |
      v=0
      o=- 0 0 IN IP4 127.0.0.1
      s=cam
      c=IN IP4 127.0.0.1
      t=0 0
      m=video 5004 RTP/AVP 96
      a=rtpmap:96 H264/90000
      a=fmtp:96 packetization-mode=1
